# Mosquitto Configuration for IoTicos God Level App

# Default MQTT listener
listener 1883
protocol mqtt

# WebSocket listener for browser clients
listener 9001
protocol websockets

# Authentication
# Set to false for production and configure proper auth
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections -1
max_keepalive 65535
